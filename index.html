<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Common Ground</title>
<meta name="description" content="A dictionary and keyboard for the CommonGround symbol font.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#dictionary">
      <span class="brand-mark" aria-hidden="true"></span>
      <span data-i18n="title">Common Ground</span>
    </a>
    <nav class="tabs">
      <a href="#dictionary" data-tab="dictionary" data-i18n="nav_dictionary">Dictionary</a>
      <a href="#keyboard" data-tab="keyboard" data-i18n="nav_keyboard">Keyboard</a>
      <a href="#about" data-tab="about" data-i18n="nav_about">About</a>
    </nav>
    <label class="lang">
      <span class="visually-hidden" data-i18n="language">Language</span>
      <select id="lang"></select>
    </label>
  </header>

  <main>
    <!-- dictionary: every symbol, searchable in any language -->
    <section id="dictionary" class="view">
      <p class="tagline" data-i18n="tagline"></p>
      <div class="toolbar">
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search">
        <div class="filters" id="filters"></div>
      </div>
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
      <p class="none" id="none" data-i18n="none" hidden></p>
    </section>

    <!-- keyboard: type in your own language, read it back in symbols -->
    <section id="keyboard" class="view" hidden>
      <div class="kb">
        <textarea id="kb-input" rows="4" spellcheck="false" data-i18n-placeholder="kb_placeholder"></textarea>
        <div class="kb-output-wrap">
          <div class="kb-output" id="kb-output" aria-live="polite"></div>
        </div>
        <div class="kb-actions">
          <button type="button" id="kb-clear" data-i18n="kb_clear">Clear</button>
          <button type="button" id="kb-copy" data-i18n="kb_copy">Copy symbols</button>
          <button type="button" id="kb-image" data-i18n="kb_image">Save as image</button>
        </div>
        <p class="note" data-i18n="kb_note"></p>
      </div>
      <h2 class="palette-title" data-i18n="kb_palette">Or tap a symbol</h2>
      <div class="palette" id="palette"></div>
    </section>

    <section id="about" class="view" hidden>
      <div class="about">
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_body"></p>
        <p data-i18n="about_font"></p>
        <p><a class="button" href="fonts/CommonGround.ttf" download data-i18n="download_font">Download the font</a></p>
      </div>
    </section>
  </main>

  <dialog id="detail">
    <form method="dialog" class="detail">
      <button class="detail-close" value="close" data-i18n-aria-label="close" aria-label="Close">×</button>
      <div class="detail-glyph" id="detail-glyph"></div>
      <h2 id="detail-word"></h2>
      <p class="detail-label" data-i18n="type_this"></p>
      <p class="detail-typed"><code id="detail-typed"></code> <button type="button" id="detail-copy" data-i18n="copy">Copy</button></p>
      <p class="detail-label" data-i18n="in_other_languages"></p>
      <dl class="detail-langs" id="detail-langs"></dl>
      <button type="button" class="button" id="detail-use" data-i18n="use_in_keyboard">Use on the keyboard</button>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="data/glyphs.js"></script>
  <script src="data/vocabulary.js"></script>
  <script src="app.js"></script>
</body>
</html>
